name: Porchday
options:
  bundleIdPrefix: org.porchday
  deploymentTarget:
    iOS: '17.4'
settings:
  base:
    SWIFT_VERSION: '6.0'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.4'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: 'NO'
    # Simulator Keychain access requires app entitlements in an ad-hoc signature.
    # Hardware/release signing still requires the owner's real Apple identity.
    'CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]': 'YES'
    'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
    'CODE_SIGN_STYLE[sdk=iphonesimulator*]': Manual
    PORCHDAY_PUSH_ENABLED: 'NO'
    PORCHDAY_APNS_ENVIRONMENT: development
    INFOPLIST_KEY_PorchdayPushEnabled: '$(PORCHDAY_PUSH_ENABLED)'
    INFOPLIST_KEY_PorchdayAPNsEnvironment: '$(PORCHDAY_APNS_ENVIRONMENT)'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_CFBundleDisplayName: Porchday
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos to encrypt and share.
    INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to encrypt and share.
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  Porchday:
    type: application
    platform: iOS
    sources:
      - Porchday
      - path: ../../packages/crypto/data/emoji-17.0.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.porchday.app
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        PROVISIONING_PROFILE_SPECIFIER: "$(PORCHDAY_PROFILE)"
        CODE_SIGN_ENTITLEMENTS: Porchday/Porchday.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Porchday/Porchday-Simulator.entitlements
    dependencies:
      - package: ZIPFoundation
      - framework: ../../packages/crypto/native/build/Porchcrypto.xcframework
        embed: true
  PorchdayMac:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - Porchday
      - path: ../../packages/crypto/data/emoji-17.0.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.porchday.app
        PRODUCT_NAME: Porchday
        PROVISIONING_PROFILE_SPECIFIER: "$(PORCHDAY_MAC_PROFILE)"
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        CODE_SIGN_ENTITLEMENTS: Porchday/Porchday-Mac.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
    dependencies:
      - package: ZIPFoundation
      - framework: ../../packages/crypto/native/build/Porchcrypto.xcframework
        embed: true
  PorchdayMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - PorchdayTests/AppleParityTests.swift
      - PorchdayTests/NativePhotoContractTests.swift
      - PorchdayTests/PorchdayTests.swift
      - PorchdayTests/CryptoVaultAccessTests.swift
      - PorchdayTests/HistoricalPostSharingTests.swift
      - PorchdayTests/PlatformInvitationTests.swift
      - PorchdayTests/RecipientKeyVerificationTests.swift
      - path: ../../packages/crypto/test/fixtures/openpgp-v1.json
        buildPhase: resources
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Porchday.app/Contents/MacOS/Porchday"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: PorchdayMac
  PorchdayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PorchdayTests
      - path: ../../packages/crypto/test/fixtures/openpgp-v1.json
        buildPhase: resources
      - path: ../../packages/crypto/test/fixtures/reactions-v1.json
        buildPhase: resources
      - path: ../../docs/archive/sample/photos/77777777-7777-4777-8777-777777777777.jpg
        buildPhase: resources
    dependencies:
      - target: Porchday
  PorchdayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PorchdayUITests]
    dependencies:
      - target: Porchday
schemes:
  Porchday:
    build:
      targets:
        Porchday: all
        PorchdayTests: [test]
        PorchdayUITests: [test]
    test:
      targets: [PorchdayTests, PorchdayUITests]
  PorchdayMac:
    build:
      targets:
        PorchdayMac: all
        PorchdayMacTests: [test]
    test:
      targets: [PorchdayMacTests]
