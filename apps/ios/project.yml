name: Porchday
options:
  bundleIdPrefix: com.porchday
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: 'NO'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_CFBundleDisplayName: Porchday
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos to encrypt and share with your people.
    INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to encrypt and share with your people.
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  Porchday:
    type: application
    platform: iOS
    sources: [Porchday]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porchday.app
    dependencies:
      - package: ZIPFoundation
      - framework: ../../packages/crypto/native/build/Porchcrypto.xcframework
        embed: true
  PorchdayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PorchdayTests
      - path: ../../packages/crypto/test/fixtures/openpgp-v1.json
        buildPhase: resources
    dependencies:
      - target: Porchday
  PorchdayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PorchdayUITests]
    dependencies:
      - target: Porchday
schemes:
  Porchday:
    build:
      targets:
        Porchday: all
        PorchdayTests: [test]
        PorchdayUITests: [test]
    test:
      targets: [PorchdayTests, PorchdayUITests]
