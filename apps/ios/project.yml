name: Porchday
options:
  bundleIdPrefix: com.porchday
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: 'NO'
    # Simulator Keychain access requires app entitlements in an ad-hoc signature.
    # Hardware/release signing still requires the owner's real Apple identity.
    'CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]': 'YES'
    'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
    'CODE_SIGN_STYLE[sdk=iphonesimulator*]': Manual
    PORCHDAY_PUSH_ENABLED: 'NO'
    PORCHDAY_APNS_ENVIRONMENT: development
    INFOPLIST_KEY_PorchdayPushEnabled: '$(PORCHDAY_PUSH_ENABLED)'
    INFOPLIST_KEY_PorchdayAPNsEnvironment: '$(PORCHDAY_APNS_ENVIRONMENT)'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_CFBundleDisplayName: Porchday
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos to encrypt and share.
    INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to encrypt and share.
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  Porchday:
    type: application
    platform: iOS
    sources: [Porchday]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porchday.app
        CODE_SIGN_ENTITLEMENTS: Porchday/Porchday.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Porchday/Porchday-Simulator.entitlements
    dependencies:
      - package: ZIPFoundation
      - framework: ../../packages/crypto/native/build/Porchcrypto.xcframework
        embed: true
  PorchdayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PorchdayTests
      - path: ../../packages/crypto/test/fixtures/openpgp-v1.json
        buildPhase: resources
      - path: ../../docs/archive/sample/photos/77777777-7777-4777-8777-777777777777.jpg
        buildPhase: resources
    dependencies:
      - target: Porchday
  PorchdayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PorchdayUITests]
    dependencies:
      - target: Porchday
schemes:
  Porchday:
    build:
      targets:
        Porchday: all
        PorchdayTests: [test]
        PorchdayUITests: [test]
    test:
      targets: [PorchdayTests, PorchdayUITests]
