<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Porchday archived videos</title><style>body{font:18px system-ui;max-width:900px;margin:2rem auto;padding:1rem}video{max-width:100%;max-height:75vh}label,select{display:block;margin:1rem 0}</style><h1>Archived videos</h1><p>Extract every archive part into one folder, then choose that folder below. Everything stays on this device.</p><input id="folder" type="file" webkitdirectory multiple><label>Video<select id="choice"></select></label><p id="status" role="status"></p><video id="player" controls playsinline></video><script>
const folder=document.querySelector('#folder'),choice=document.querySelector('#choice'),status=document.querySelector('#status'),player=document.querySelector('#player');let files=new Map(),records=[],url='',generation=0;
const hex=bytes=>Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
folder.onchange=async()=>{generation++;player.removeAttribute('src');player.load();URL.revokeObjectURL(url);records=[];files=new Map();choice.replaceChildren();try{for(const file of folder.files){const path=file.webkitRelativePath.split('/').slice(1).join('/');if(files.has(path))throw Error('Duplicate archive path');files.set(path,file);}for(const[path,file]of files){if(!/^archive-part-[0-9]+\.json$/.test(path)&&path!=='archive.json')continue;if(file.size>8*1024*1024)throw Error('Archive index is too large');const manifest=JSON.parse(await file.text());if(manifest.format!=='porchday-archive')continue;for(const record of manifest.media||[])if(record.videoVersion===2&&!records.some(r=>r.id===record.id))records.push(record);}for(const[index,record]of records.entries()){const option=document.createElement('option');option.value=index;option.textContent=record.alt||record.name||'Video '+(index+1);choice.append(option);}status.textContent=records.length+' archived videos';if(records.length)await play();}catch(error){status.textContent=error.message;}};
async function play(){const run=++generation;player.removeAttribute('src');player.load();URL.revokeObjectURL(url);try{const record=records[Number(choice.value)];if(!record||!/^[-a-f0-9]{36}$/.test(record.id)||!Array.isArray(record.segments)||record.segments.length<1||record.segments.length>63||record.size>250*1024*1024)throw Error('Invalid video index');let size=0;const parts=[];for(const[index,segment]of record.segments.entries()){if(segment.index!==index||segment.path!=='videos/'+record.id+'/'+index+'.part')throw Error('Invalid video path');const file=files.get(segment.path);if(!file||file.size!==segment.size||file.size>4*1024*1024||file.size<1)throw Error('A video piece is missing. Extract all archive parts together.');status.textContent='Checking video piece '+(index+1)+' of '+record.segments.length;if(hex(await crypto.subtle.digest('SHA-256',await file.arrayBuffer()))!==segment.sha256)throw Error('A video piece failed its checksum');if(run!==generation)return;size+=file.size;parts.push(file);}if(size!==record.size)throw Error('Video size does not match');url=URL.createObjectURL(new Blob(parts,{type:'video/mp4'}));player.src=url;status.textContent=record.alt||'Ready to play';}catch(error){status.textContent=error.message;}}
choice.onchange=()=>void play();
</script>
