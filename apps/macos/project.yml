name: PorchdayMac
options:
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Porchday:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: build/Porchday.app/Contents/Resources
        buildPhase: resources
        excludes: ['Info.plist']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.porchday.macos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Porchday
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_PorchdayDistribution: TestFlight
        CODE_SIGN_ENTITLEMENTS: Porchday.entitlements
schemes:
  Porchday:
    build:
      targets:
        Porchday: all
    archive:
      config: Release
