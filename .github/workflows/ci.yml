name: Verify Porchday
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: porchday-ci-only
          POSTGRES_DB: porchday
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday
      DATABASE_MIGRATION_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday
      PG_LOCAL: 'true'
      MODERATION_TEST_DATABASE_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday_moderation_test
      SOCIAL_TEST_DATABASE_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday_social_test
      SOCIAL_HTTP_DATABASE_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday_http_test
      PUSH_TEST_DATABASE_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday_push_test
      NATIVE_PUSH_TEST_DATABASE_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday_native_push_test
      JOURNAL_TEST_DATABASE_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday_journal_test
      AUTH_JOURNAL_TEST_DATABASE_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday_auth_journal_test
      STAFF_ROLE_TEST_DATABASE_URL: postgres://postgres:porchday-ci-only@localhost:5432/porchday_staff_role_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/check-format.py
      - run: python3 -m unittest discover -s scripts -p 'test_check_format.py'
      - run: python3 -m unittest discover -s scripts -p 'test_check_secrets.py'
      - run: node scripts/migrate.ts
      - run: npm run typecheck
      - run: npx tsc -p scripts/tsconfig.external-monitor.json
      - run: npx tsc -p scripts/tsconfig.deployment-recovery.json
      - run: node --input-type=module -e "await import('./scripts/deployment-recovery.ts'); await import('./scripts/deployment-recovery-journal.ts'); await import('./scripts/cloudflare-deployment-client.ts'); await import('./scripts/deployment-recovery-lease.ts'); await import('./scripts/release-verification.ts')"
      - run: npx tsc -p scripts/tsconfig.availability-report.json
      - run: npx tsc -p scripts/tsconfig.release-assets.json
      - run: node --input-type=module -e "await import('./scripts/release-assets.ts'); await import('./scripts/release-assets-verify.ts'); await import('./scripts/release-assets-browser.ts')"
      - run: node --input-type=module -e "await import('./scripts/availability-report.ts')"
      - run: node --input-type=module -e "await import('./scripts/external-monitor-backup.ts'); await import('./scripts/external-monitor-relay.ts'); await import('./scripts/external-monitor-delivery.ts')"
      - run: node scripts/prepare-test-databases.ts
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check-secrets.py
