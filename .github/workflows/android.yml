name: Verify Android
on:
  workflow_dispatch:
  push:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, lint and package
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - name: Retain test and lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks-${{ github.run_id }}
          path: apps/android/app/build/reports/
          if-no-files-found: warn
      - name: Record build provenance
        run: |
          mkdir -p apps/android/artifacts
          printf '%s\n' "$GITHUB_SHA" > apps/android/artifacts/source.txt
          sha256sum apps/android/app/build/outputs/apk/debug/*.apk apps/android/app/build/outputs/bundle/release/*.aab > apps/android/artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: porchday-android-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/reports/
            apps/android/artifacts/
          if-no-files-found: error
