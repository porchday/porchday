name: Verify invitation connections browser
on:
  push:
    paths:
      - 'apps/web/src/**'
      - 'scripts/check-invitation-connections.mjs'
      - '.github/workflows/invitation-connections.yml'
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'scripts/check-invitation-connections.mjs'
      - '.github/workflows/invitation-connections.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-browser-ci.sh
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 8
      - run: node scripts/check-invitation-connections.mjs
