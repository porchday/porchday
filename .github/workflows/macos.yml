name: macOS app
on:
  pull_request:
    paths: ['apps/macos/**', 'apps/web/public/icon-1024.png', '.github/workflows/macos.yml']
  push:
    tags: ['macos-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Navigation policy tests
        run: apps/macos/test.sh
      - name: Build universal preview
        run: apps/macos/build.sh
      - name: Compile TestFlight target (unsigned; no distribution claim)
        run: |
          brew install xcodegen
          xcodegen generate --spec apps/macos/project.yml
          xcodebuild -project apps/macos/PorchdayMac.xcodeproj -scheme Porchday -configuration Release -destination "generic/platform=macOS" -derivedDataPath apps/macos/build/TestFlightDerived build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: Porchday-macOS-preview
          path: |
            apps/macos/build/*.zip
            apps/macos/build/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Porchday-macOS-preview
          path: release
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Standalone AppKit/WebKit macOS preview, macOS 13+, Apple silicon and Intel.
          Download the ZIP, unzip, and drag Porchday.app into Applications.
          This preview is ad-hoc signed, not Apple-notarized. macOS may require System Settings → Privacy & Security → Open Anyway after the first launch attempt.
          Your Chrome sign-in and encryption keys do not transfer. Have your Porchday recovery secret ready, and keep your existing app until your history opens here.
          Native Photos-library selection, sign-in/history restoration, exports and Intel hardware still require owner verification. This does not establish a fix for the Chrome Photos-picker issue.
          See apps/macos/README.md at this tag for build instructions and limitations. SHA256SUMS.txt contains archive checksums.
          NOTES
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "Porchday for macOS — $RELEASE_TAG preview" --notes-file notes.md
