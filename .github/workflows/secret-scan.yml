name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          audit_tool_dir="$RUNNER_TEMP/porchday-gitleaks"
          mkdir -p "$audit_tool_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$audit_tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$audit_tool_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$audit_tool_dir/gitleaks.tar.gz" -C "$audit_tool_dir" gitleaks
          "$audit_tool_dir/gitleaks" version
      - name: Scan all reachable history and complete file versions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import subprocess

          if subprocess.check_output(['git', 'rev-parse', '--is-shallow-repository'], text=True).strip() != 'false':
              raise SystemExit('Secret scanning requires full Git history.')
          root = Path(os.environ['RUNNER_TEMP']) / 'porchday-gitleaks'
          versions = root / 'versions'
          versions.mkdir()
          ignored = root / 'empty-ignore'
          ignored.mkdir()
          objects = subprocess.check_output(['git', 'rev-list', '--objects', '--all'], text=True).splitlines()
          names = {line.split(' ', 1)[0]: line.split(' ', 1)[1] if ' ' in line else '' for line in objects}
          metadata = subprocess.check_output(
              ['git', 'cat-file', '--batch-check=%(objectname) %(objecttype) %(objectsize)'],
              input='\n'.join(names) + '\n', text=True,
          ).splitlines()
          blobs = [line.split() for line in metadata if ' blob ' in line]
          commit_metadata = root / 'commit-metadata'
          commit_metadata.mkdir()
          for row in metadata:
              oid, kind, _ = row.split()
              if kind in ('commit', 'tag'):
                  (commit_metadata / oid).write_bytes(subprocess.check_output(['git', 'cat-file', kind, oid]))
          (commit_metadata / 'historical-filenames').write_bytes(subprocess.check_output(
              ['git', 'log', '--all', '--full-history', '-m', '--format=', '--name-only', '-z', '--no-renames']).replace(b'\0', b'\n'))
          (commit_metadata / 'refs').write_bytes(subprocess.check_output(['git', 'for-each-ref', '--format=%(refname)']))
          # Refuse incomplete coverage instead of silently skipping a large history.
          if sum(int(row[2]) for row in blobs) > 512 * 1024 * 1024:
              raise SystemExit('History exceeds the reviewed full-blob scan budget; review and raise the budget explicitly.')
          for oid, _, size in blobs:
              name = PurePosixPath(names[oid])
              if not names[oid] or name.is_absolute() or '..' in name.parts:
                  raise SystemExit('Unsafe historical Git path; manual audit required.')
              destination = versions / oid / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              data = subprocess.check_output(['git', 'cat-file', 'blob', oid])
              if len(data) != int(size):
                  raise SystemExit('A Git blob could not be read completely.')
              destination.write_bytes(data)
          common = [
              '--config', str(Path('.gitleaks.toml').resolve()), '--redact=100',
              '--no-banner', '--no-color', '--ignore-gitleaks-allow',
              '--gitleaks-ignore-path', str(ignored), '--max-archive-depth', '3',
              '--max-decode-depth', '5', '--report-format', 'json', '--timeout', '600',
          ]
          scans = {
              'history': ['git', '--log-opts=--all --full-history -m --no-renames', '.'],
              'complete-file-versions': ['dir', str(versions)],
              'commit-tag-and-path-metadata': ['dir', str(commit_metadata)],
          }
          failed = False
          environment = {key: value for key, value in os.environ.items() if not key.startswith('GITLEAKS_')}
          for label, arguments in scans.items():
              report = root / (label + '.json')
              result = subprocess.run(
                  [str(root / 'gitleaks'), *arguments, *common, '--report-path', str(report)],
                  capture_output=True, text=True, env=environment,
              )
              # Never echo scanner matches, raw lines, credentials, or raw errors.
              if result.returncode not in (0, 1) or not report.is_file():
                  print(json.dumps({'scan': label, 'status': 'scanner error; no clean result'}))
                  failed = True
                  continue
              findings = json.loads(report.read_text())
              print(json.dumps({'scan': label, 'findings': len(findings), 'blobs': len(blobs)}))
              for finding in findings:
                  print(json.dumps({
                      'rule': finding['RuleID'], 'line': finding['StartLine'],
                      'commit': finding.get('Commit', ''),
                      'file_sha256': hashlib.sha256(finding['File'].encode()).hexdigest(),
                  }))
              failed = failed or bool(findings) or result.returncode != 0
          if failed:
              raise SystemExit('Secret scan requires review. Reproduce locally for private file-level triage; reports are not uploaded.')
          PY
