name: Verify reaction save feedback
on:
  push:
    paths:
      - 'apps/web/src/**'
      - 'packages/crypto/**'
      - 'scripts/check-reaction-save-feedback.mjs'
      - 'package-lock.json'
      - '.github/workflows/reaction-save-feedback.yml'
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'packages/crypto/**'
      - 'scripts/check-reaction-save-feedback.mjs'
      - 'package-lock.json'
      - '.github/workflows/reaction-save-feedback.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-reaction-save-feedback.mjs
