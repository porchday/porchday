title = "Porchday reviewed secret-scan exceptions"

# Keep the upstream detector rules. Every exception below requires BOTH its
# exact file and reviewed value/field. Do not exclude test trees or commits.
[extend]
useDefault = true

[[allowlists]]
description = "Cloudflare Access audience IDs are routing metadata, not authentication credentials."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ["(?:^|/)apps/api/wrangler\\.(?:staging|production)\\.jsonc$"]
regexes = ["^\\s*\"STAFF_ACCESS_AUDIENCE\"\\s*:\\s*\"[a-f0-9]{64}\"[,]?\\s*$"]

[[allowlists]]
description = "Provider resource IDs identify Access policies/apps or Hyperdrive bindings; they do not authenticate."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ["(?:^|/)infra/resources\\.json$"]
regexes = ["^\\s*\"(?:staff_access_audience|staff_access_application_id|staff_access_policy_id|staff_access_launcher_policy_id|hyperdrive_auth)\"\\s*:\\s*\"(?:[a-f0-9]{32}|[a-f0-9]{64}|[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12})\"[,]?\\s*$"]

[[allowlists]]
description = "Exact synthetic monitor-test constants; no real provider credential is accepted."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ["(?:^|/)apps/monitor/test/workerd\\.test\\.ts$"]
regexes = [
  "^synthetic-health-capability-123456789$",
]

[[allowlists]]
description = "Exact synthetic interoperability fixture values; regenerate only with explicit fixture review."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ["(?:^|/)packages/crypto/test/fixtures/openpgp-v1\\.json$"]
regexes = [
  "^S6VKDoJnYkyNXbw9GMwhxBWYlTYd0Bnt40OGK3RvLzc$",
  "^kecevQ5_KPrN8CooBqKwSdITQtVH8XXzSX9yF6wvivk$",
